<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ОИП — Отчет 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:#fff;color:#1a2a4a;min-height:100vh}
.topbar{background:#f8fafc;border-bottom:1px solid #e8eef5;padding:12px 28px;display:flex;align-items:center;justify-content:space-between}
.topbar-logo{font-size:13px;font-weight:700;color:#aaa;letter-spacing:1px}
.tab-group{display:flex;border:1.5px solid #dde4ee;border-radius:8px;overflow:hidden}
.tab{padding:7px 20px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:#fff;color:#aaa;letter-spacing:.3px;transition:all .15s}
.tab.on{background:#1a3a6b;color:#fff}
.updated{font-size:11px;color:#bbb}
.page{padding:28px 32px;display:none}
.page.show{display:block}
.report-title{font-size:22px;font-weight:800;color:#1a2a4a;letter-spacing:.5px;text-transform:uppercase;margin-bottom:24px}
.report-title span{color:#00a8cc}
.report-body{display:grid;grid-template-columns:175px 1fr;gap:24px}
.stats-panel{display:flex;flex-direction:column;gap:24px;padding-right:20px;border-right:1px solid #eef2f8}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#00a8cc;line-height:1.5;margin-bottom:4px}
.stat-value{font-size:44px;font-weight:900;color:#1a2a4a;line-height:1}
.stat-sub{font-size:13px;color:#00a8cc;font-weight:700;margin-top:2px}
.stat-hint{font-size:11px;color:#aaa;margin-top:2px}
.charts-grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.type-top{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.type-bot{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chart-card{background:#f8fafc;border-radius:14px;padding:16px 14px;display:flex;flex-direction:column;align-items:center}
.chart-card-title{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#00a8cc;margin-bottom:10px;text-align:center}
.chart-wrap{position:relative;width:160px;height:160px}
.legend{margin-top:10px;width:100%;display:flex;flex-direction:column;gap:4px}
.leg-row{display:flex;align-items:center;gap:6px}
.leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.leg-name{font-size:11px;color:#666;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-count{font-size:11px;font-weight:700;color:#1a2a4a}
@media(max-width:860px){
  .report-body{grid-template-columns:1fr}
  .stats-panel{border-right:none;border-bottom:1px solid #eef2f8;padding-bottom:20px;flex-direction:row;flex-wrap:wrap;gap:16px}
  .g3,.type-top,.type-bot{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">ОИП · ОТЧЕТ</div>
  <div class="tab-group">
    <button class="tab on" onclick="showView('div')">По дивизионам</button>
    <button class="tab" onclick="showView('type')">По типам</button>
  </div>
  <div class="updated">Данные: Сводка типов 2026</div>
</div>

<div id="view-div" class="page show">
  <div class="report-title">Отдел инициации проектов <span>2026</span></div>
  <div class="report-body">
    <div class="stats-panel">
      <div>
        <div class="stat-label">Общее кол-во<br>запросов</div>
        <div class="stat-value">235</div>
      </div>
      <div>
        <div class="stat-label">С видео</div>
        <div class="stat-value" style="font-size:38px">26</div>
        <div class="stat-hint">11% от всех</div>
      </div>
    </div>
    <div class="charts-grid g3" id="div-charts"></div>
  </div>
</div>

<div id="view-type" class="page">
  <div class="report-title">Отдел инициации проектов <span>2026</span></div>
  <div class="report-body">
    <div class="stats-panel">
      <div>
        <div class="stat-label">Общее кол-во<br>запросов</div>
        <div class="stat-value">235</div>
      </div>
      <div>
        <div class="stat-label">Процент<br>концептов</div>
        <div class="stat-value" style="font-size:38px">60</div>
        <div class="stat-sub">(25,5%)</div>
      </div>
      <div>
        <div class="stat-label">Видео для<br>концептов</div>
        <div class="stat-value" style="font-size:38px">26</div>
        <div class="stat-sub">(40,6%)</div>
      </div>
    </div>
    <div>
      <div class="type-top" id="type-charts-top"></div>
      <div style="height:14px"></div>
      <div class="type-bot" id="type-charts-bot"></div>
    </div>
  </div>
</div>

<script>
// ── DATA from "Сводка типов" sheet ─────────────────────────────────────────
const DIV_DATA = [
  {name:'Центр',   Концепт:10, Посадка:19, Визуализация:20, Планировки:3,  ЭП:6,  всего:64},
  {name:'Алматы',  Концепт:5,  Посадка:11, Визуализация:16, Планировки:4,  ЭП:5,  всего:43},
  {name:'Юг',      Концепт:10, Посадка:13, Визуализация:8,  Планировки:9,  ЭП:0,  всего:43},
  {name:'Запад',   Концепт:9,  Посадка:6,  Визуализация:12, Планировки:0,  ЭП:5,  всего:35},
  {name:'РДС',     Концепт:10, Посадка:0,  Визуализация:4,  Планировки:0,  ЭП:0,  всего:15},
  {name:'Ташкент', Концепт:8,  Посадка:3,  Визуализация:6,  Планировки:1,  ЭП:0,  всего:18},
  {name:'Другое',  Концепт:7,  Посадка:1,  Визуализация:3,  Планировки:1,  ЭП:1,  всего:16},
];

const TYPE_DATA = [
  {name:'Концепт', всего:60,
   divs:[['Центр',10],['Алматы',5],['Юг',10],['Запад',9],['РДС',10],['Ташкент',8],['Другое',7],['Intern',1]]},
  {name:'Визуализация', всего:69,
   divs:[['Центр',20],['Алматы',16],['Запад',12],['Ташкент',6],['Юг',8],['Другое',3],['РДС',4]]},
  {name:'Посадка', всего:53,
   divs:[['Центр',19],['Алматы',11],['Юг',13],['Запад',6],['Ташкент',3],['Другое',1]]},
  {name:'ЭП', всего:17,
   divs:[['Центр',6],['Алматы',5],['Запад',5],['Другое',1]]},
  {name:'Планировки', всего:18,
   divs:[['Юг',9],['Алматы',4],['Центр',3],['Другое',1],['Ташкент',1]]},
];

// ── COLORS ─────────────────────────────────────────────────────────────────
const TYPE_COLORS = {
  'Концепт':'#1e3a6b', 'Посадка':'#f0a030', 'Визуализация':'#f5d8a8',
  'Планировки':'#9ab8cc', 'ЭП':'#c8dff0', 'Без типа':'#e8e8e8'
};
const DIV_COLORS = [
  '#1e3a6b','#4a80c0','#f0a030','#f5d8a8','#9ab8cc','#c8dff0','#d0d8e8','#e0e0e0'
];
const DIV_NAMES = ['Центр','Алматы','Юг','Запад','РДС','Ташкент','Другое','Intern'];

function divColor(name) {
  const i = DIV_NAMES.indexOf(name);
  return i >= 0 ? DIV_COLORS[i] : '#ccc';
}

// ── CHART ENGINE ───────────────────────────────────────────────────────────
const charts = {};

function makeDonut(idx, labels, data, colors, total) {
  const canvasId = 'chart_' + idx;
  if (charts[canvasId]) { charts[canvasId].destroy(); }
  const el = document.getElementById(canvasId);
  if (!el) { console.warn('Canvas not found:', canvasId); return; }

  const plugin = {
    id: 'center',
    afterDraw(chart) {
      const {ctx, chartArea:{width,height,left,top}} = chart;
      ctx.save();
      ctx.font = 'bold 30px Segoe UI,Arial,sans-serif';
      ctx.fillStyle = '#1a2a4a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(total), left + width/2, top + height/2);
      ctx.restore();
    }
  };

  charts[canvasId] = new Chart(el.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderWidth: 3, borderColor: '#fff' }]
    },
    options: {
      responsive: false,
      cutout: '66%',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ' ' + c.label + ': ' + c.raw } }
      }
    },
    plugins: [plugin]
  });
}

// ── CARD HTML ──────────────────────────────────────────────────────────────
function cardHTML(idx, title, labels, data, colors, total) {
  const legs = labels.map((l,i) =>
    '<div class="leg-row">' +
    '<div class="leg-dot" style="background:' + colors[i] + '"></div>' +
    '<div class="leg-name" title="' + l + '">' + l + '</div>' +
    '<div class="leg-count">' + data[i] + '</div>' +
    '</div>'
  ).join('');
  return '<div class="chart-card">' +
    '<div class="chart-card-title">' + title + '</div>' +
    '<div class="chart-wrap"><canvas id="chart_' + idx + '" width="160" height="160"></canvas></div>' +
    '<div class="legend">' + legs + '</div>' +
    '</div>';
}

// ── RENDER BY DIVISION ─────────────────────────────────────────────────────
function renderByDiv() {
  const TYPES = ['Концепт','Посадка','Визуализация','Планировки','ЭП'];
  const html = DIV_DATA.map((div, i) => {
    const labels = [], data = [], colors = [];
    let sum = 0;
    TYPES.forEach(t => {
      if (div[t] > 0) {
        labels.push(t); data.push(div[t]); colors.push(TYPE_COLORS[t]); sum += div[t];
      }
    });
    const noType = div.всего - sum;
    if (noType > 0) { labels.push('Без типа'); data.push(noType); colors.push(TYPE_COLORS['Без типа']); }
    return cardHTML(i, div.name, labels, data, colors, div.всего);
  }).join('');

  document.getElementById('div-charts').innerHTML = html;
  setTimeout(() => {
    DIV_DATA.forEach((div, i) => {
      const TYPES = ['Концепт','Посадка','Визуализация','Планировки','ЭП'];
      const labels = [], data = [], colors = [];
      let sum = 0;
      TYPES.forEach(t => {
        if (div[t] > 0) { labels.push(t); data.push(div[t]); colors.push(TYPE_COLORS[t]); sum += div[t]; }
      });
      const noType = div.всего - sum;
      if (noType > 0) { labels.push('Без типа'); data.push(noType); colors.push(TYPE_COLORS['Без типа']); }
      makeDonut(i, labels, data, colors, div.всего);
    });
  }, 80);
}

// ── RENDER BY TYPE ─────────────────────────────────────────────────────────
function renderByType() {
  const offset = DIV_DATA.length; // use offset so IDs don't collide with div charts
  function makeCards(types, containerId) {
    document.getElementById(containerId).innerHTML = types.map((t, j) => {
      const labels = t.divs.map(d => d[0]);
      const data   = t.divs.map(d => d[1]);
      const colors = labels.map(l => divColor(l));
      return cardHTML(offset + (containerId === 'type-charts-top' ? j : 2 + j), t.name, labels, data, colors, t.всего);
    }).join('');
    setTimeout(() => {
      types.forEach((t, j) => {
        const labels = t.divs.map(d => d[0]);
        const data   = t.divs.map(d => d[1]);
        const colors = labels.map(l => divColor(l));
        makeDonut(offset + (containerId === 'type-charts-top' ? j : 2 + j), labels, data, colors, t.всего);
      });
    }, 80);
  }
  makeCards(TYPE_DATA.slice(0,2), 'type-charts-top');
  makeCards(TYPE_DATA.slice(2),   'type-charts-bot');
}

// ── VIEW SWITCH ────────────────────────────────────────────────────────────
let currentView = 'div';
function showView(v) {
  if (currentView === v) return;
  currentView = v;
  document.getElementById('view-div').className  = 'page' + (v === 'div'  ? ' show' : '');
  document.getElementById('view-type').className = 'page' + (v === 'type' ? ' show' : '');
  document.querySelectorAll('.tab').forEach((t,i) =>
    t.classList.toggle('on', (v==='div'&&i===0)||(v==='type'&&i===1)));
  if (v === 'div') renderByDiv(); else renderByType();
}

// ── INIT ───────────────────────────────────────────────────────────────────
renderByDiv();
</script>
</body>
</html>
